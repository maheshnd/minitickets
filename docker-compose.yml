# Runs the local Postgres database and Redis. Start both with `pnpm db:up`.
# The full app (migrate, api, web) also runs here, but only with the "app" profile: `pnpm app:up`.
# Docker Compose reads the ${...} values below from the root .env file.
services:
  postgres:
    # 1. Pinned version: everyone runs the exact same Postgres, so nothing changes by surprise.
    image: postgres:17.6
    restart: unless-stopped
    # 2. Credentials come from the root .env (see .env.example).
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    # 3. Named volume: the data lives outside the container, so it survives `pnpm db:down`.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # 4. Healthcheck: Docker runs pg_isready every few seconds and marks the
    #    container "healthy" only once Postgres really accepts connections.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    # 1. Pinned version, same reason as Postgres.
    image: redis:7.4.5
    restart: unless-stopped
    # 2. The container always listens on 6379. The host port comes from REDIS_PORT
    #    (default 6379), so it can move if another project already uses 6379.
    ports:
      - "${REDIS_PORT:-6379}:6379"
    # 3. Named volume + appendonly: sessions survive a container restart.
    # 3b. Memory limit + eviction policy (Step 8: one events cache key per filter, so the number of
    #     keys depends on what people ask for). What happens when memory is full:
    #     - maxmemory 256mb: the limit. Without one (the default, 0) Redis never evicts anything; it
    #       grows until the machine runs out of memory. 256mb is far more than local dev needs.
    #     - maxmemory-policy allkeys-lru: when memory is full, evict the LEAST RECENTLY USED keys
    #       (any key, with or without a TTL) to make room. Busy keys stay; forgotten filters go first.
    #       The default, "noeviction", would instead REFUSE new writes with an error.
    #     Trade-off: sessions live in this same Redis, so under real memory pressure an idle
    #     session could be evicted too (= that user is logged out). The generation key is read on
    #     every events.list, so LRU practically never picks it.
    #     A running container only picks this up when it is recreated: `pnpm db:up` does that.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    # 4. Healthcheck: `redis-cli ping` answers PONG once Redis accepts commands.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---- The app, in containers. Only started with `--profile app` (`pnpm app:up`). ----

  # @concept: migrations
  # One-off job: applies the SQL migrations, then exits. It is separate from the api on purpose:
  # if several api containers ran migrations at startup, they would race each other.
  migrate:
    # 1. build: make the image from our Dockerfile instead of downloading one.
    #    `context: .` is the repo root (the Dockerfile copies files from several folders);
    #    `dockerfile` says which Dockerfile inside that context.
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # image: the name given to the built image, so it is easy to find with `docker images`
    #        and so migrate and api share one name.
    image: minitickets-api
    # 2. profiles: a service with a profile starts only when that profile is asked for.
    #    So plain `pnpm db:up` still starts only postgres and redis.
    profiles: ["app"]
    # 3. command: replaces the image's default command (start the server) with the migration runner.
    command: ["node", "dist/migrate.js"]
    # 4. environment: values for the container, given when it runs (never baked into the image).
    #    "postgres" is the service name above; inside the compose network it is the host name.
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    # 5. depends_on + service_healthy: wait until postgres passes its healthcheck.
    depends_on:
      postgres:
        condition: service_healthy
    # 6. restart "no": a one-off job must run once and stay finished, not restart in a loop.
    restart: "no"

  api:
    # 1. Same Dockerfile and image name as migrate (the second build is instant, from cache).
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # image / profiles: same meaning as in migrate above.
    image: minitickets-api
    profiles: ["app"]
    # restart: bring the API back if it crashes, but not after you stopped it yourself.
    restart: unless-stopped
    # 2. ports "host:container": the API listens on 4000 inside; 4100 on your machine avoids
    #    a clash with `pnpm dev`, which uses 4000.
    ports:
      - "4100:4000"
    # 3. environment: the settings the API checks at startup (apps/api/src/config/env.ts).
    #    WEB_ORIGIN must be the address the BROWSER uses for the web app, because CORS compares it.
    #    postgres and redis are reached by service name, on their normal container ports.
    environment:
      WEB_ORIGIN: http://localhost:3100
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
    # 4. depends_on: start only after migrate finished successfully (exit code 0) and redis is healthy.
    #    If migrate fails, the api never starts on an old database.
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # @concept: health-checks
    # 5. healthcheck: the slim image has no curl, so use node to call /health. This lets
    #    `up --wait` and `depends_on` know when the API really answers.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    # 1. build.args: values for the ARG lines in the Dockerfile. NEXT_PUBLIC_API_URL is copied into
    #    the browser JavaScript at build time, so it is the API address as the BROWSER sees it
    #    (the published port 4100), not the compose network name.
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4100
    # image / profiles / restart: same meaning as in api above.
    image: minitickets-web
    profiles: ["app"]
    restart: unless-stopped
    # 2. ports: the web server listens on 3000 inside; 3100 on your machine avoids a clash with `pnpm dev`.
    ports:
      - "3100:3000"
    # @concept: server-to-server-calls
    # 3. environment: read by the web SERVER when a request comes in (not baked into the image).
    #    API_INTERNAL_URL is where the web server calls the API to render /events. Server to server,
    #    so it uses the compose service name "api" and the container port 4000, unlike the
    #    browser's NEXT_PUBLIC_API_URL above (localhost:4100, the address the BROWSER sees).
    environment:
      API_INTERNAL_URL: http://api:4000
    # 4. depends_on: start after the API is healthy, so the first page load can already log in.
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
