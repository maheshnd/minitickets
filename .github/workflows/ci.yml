# CI: runs the checks on every push and pull request. See docs/10-ci.md.
name: CI

on:
  push:
  pull_request:

# @concept: least-privilege
# 1. Least privilege: the token these jobs get can only READ the repo. No job here needs more.
permissions:
  contents: read

# 2. One run per branch at a time: a new push cancels the older, now useless, run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# @concept: ci-pipeline
jobs:
  # Fast checks that need no database: types, lint rules and unit tests.
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # pnpm's version comes from "packageManager" in the root package.json.
      - uses: pnpm/action-setup@v4
      # Node's version comes from .nvmrc; `cache: pnpm` keeps pnpm's download store between runs.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # --frozen-lockfile: fail if pnpm-lock.yaml does not match the package.json files.
      - run: pnpm install --frozen-lockfile
      # @concept: static-checks
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # The handbook and the code must agree: every @concept anchor has a card and vice versa.
      - run: pnpm docs:check

  # Real browser tests against the real app, Postgres and Redis.
  e2e:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # These values are for a throwaway database inside this job. They are not real secrets.
    env:
      PORT: 4000
      WEB_ORIGIN: http://localhost:3000
      DATABASE_URL: postgres://minitickets:minitickets@localhost:5432/minitickets
      REDIS_URL: redis://localhost:6379
      # Baked into the web app at build time (`next build`), so it must be set before the build.
      NEXT_PUBLIC_API_URL: http://localhost:4000

    # Service containers: GitHub starts them before the steps and waits for the healthchecks.
    # Same pinned versions and healthchecks as docker-compose.yml.
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: minitickets
          POSTGRES_PASSWORD: minitickets
          POSTGRES_DB: minitickets
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U minitickets -d minitickets"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7.4.5
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Create the tables (the SQL files in apps/api/drizzle).
      - name: Run database migrations
        run: pnpm --filter @minitickets/api exec drizzle-kit migrate

      # Sample events for e2e/events.spec.ts. Uses DATABASE_URL from the job env above.
      - name: Seed the database
        run: pnpm --filter @minitickets/api exec tsx src/db/seed.ts

      # Browsers are big, so cache them. The key changes when the lockfile (and so Playwright) changes.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # Cache miss: download Chromium (only Chromium) and the Linux libraries it needs.
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @minitickets/web exec playwright install --with-deps chromium
      # Cache hit: the browser is already there, but the Linux libraries are not (the runner is fresh).
      - name: Install Chromium system libraries
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @minitickets/web exec playwright install-deps chromium

      # playwright.config.ts starts the API and the web app itself when CI=true.
      - run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  # Proves both Docker images build. Nothing is pushed anywhere (no registry yet).
  docker:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 1. Get the code. The Dockerfiles copy files from it.
      - uses: actions/checkout@v4

      # 2. Set up Buildx, Docker's modern builder. The default builder cannot use the GitHub
      #    Actions cache, Buildx can.
      - uses: docker/setup-buildx-action@v3

      # @concept: docker-layer-caching
      # 3. Build the API image. `push: false` = build only, so a broken Dockerfile fails CI
      #    but nothing is published. `context: .` is the repo root (the Dockerfile needs several folders).
      #    cache-from / cache-to: store the layers in the GitHub Actions cache, so the next run reuses
      #    unchanged layers (like the pnpm install) instead of rebuilding them. mode=max also stores
      #    the layers of the build stages that are not part of the final image. `scope` keeps the
      #    API and web caches apart so they do not overwrite each other.
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      # 4. Build the web image. build-args gives the Dockerfile its NEXT_PUBLIC_API_URL ARG; the
      #    build fails without it. The value is the same one docker-compose.yml uses.
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          build-args: NEXT_PUBLIC_API_URL=http://localhost:4100
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
