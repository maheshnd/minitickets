# CD ("continuous deployment"): takes code that CI approved and puts it live on AWS.
#   Job publish (Step 12a): build the api, web and worker IMAGES (packed, ready-to-run copies of
#     the app; the worker one since S1c) and store them in ECR (Amazon's private image storage).
#   Job deploy (Step 12b): after a human clicks "Approve", run those images on AWS.
#
# Beginner's guide, with every word explained: docs/handbook/guides/cicd-story.md.
# The "# CHAPTER N" lines below match the chapters of that guide.
#
# FLOW (read this first):
#
#   push to main ──▶ CI (ci.yml) ── failed? ──▶ CD does nothing
#                        │ green
#                        ▼
#   ┌─ JOB publish ─────────────────────────────────────────────────────────────────────┐
#   │ build api + web + worker :<sha> for ARM64, push to ECR (skip tags that exist)      │
#   └────────────────────────────────────────────────────────────────────────────────────┘
#                        │ success                      "Run workflow" with image_tag = <old sha>:
#                        │                              publish is SKIPPED, deploy runs with that tag
#                        ▼                              (rollback / redeploy)
#   ┌─ JOB deploy (GitHub environment "dev") ───────────────────────────────────────────┐
#   │ ⏸ waits until YOU click "Approve" in the Actions tab                               │
#   │ 1. log in to AWS as the deploy role (OIDC: no stored password, keys last 2 h)      │
#   │ 1b. GUARD: older infra code than the deployed commit (SSM), or superseded by a     │
#   │     newer commit on main?  yes ──▶ fail (nothing changed)                          │
#   │ 2. <tag> in all 3 ECR repos?  no ──▶ fail (nothing changed)                        │
#   │ 3. committed Pulumi.dev.yaml says computeEnabled false?                            │
#   │      yes ──▶ pulumi up (this is how "everything off/on" works), summary, END       │
#   │ 4. PHASE A  pulumi up --config migrationImageTag=<tag>                             │
#   │      app keeps the CURRENT version (SSM); anything missing is created (DB, ...)    │
#   │      (worker: the new tag if the current one has no worker image yet, S1c)         │
#   │ 5. migration task with the NEW image ── fails? ──▶ stop; running app untouched     │
#   │ 6. PHASE B  SSM image-tag = <tag>; ECR tag deployed-<tag>; pulumi up ──▶ roll      │
#   │ 7. wait until api + web are stable, and really run the new version; same for the  │
#   │    worker Lambda (its image tag) and its queue trigger (Enabled)                   │
#   │      (first time web exists: restart the api once, so it can find "web")           │
#   │ 8. smoke test: GET / and /trpc/events.list ── fail ──▶ print ECS events, fail      │
#   │ 9. SSM deployed-commit = this commit (once its `pulumi up` has started)            │
#   │ 10. job summary: tag, migration, URL, how to roll back                             │
#   └────────────────────────────────────────────────────────────────────────────────────┘
#
# Build once, then promote: publish builds each commit's images ONCE. deploy runs THOSE exact
# images (same tag, same content); it never builds anything itself.
# Two places decide what runs on AWS:
#   WHAT exists         = the switches in the committed infra/Pulumi.dev.yaml;
#   WHICH version runs  = SSM /minitickets/dev/image-tag (one small note stored in AWS, written in
#                         phase B).
#
# Step docs: docs/handbook/PENDING.md (Steps 12a, 12b) until the next handbook catch-up.
name: CD

# CHAPTERS 1-2 (push, then CI) happen in ci.yml. This block says when CD starts: after CI.
on:
  # 1. Start after the "CI" workflow (the `name:` in ci.yml) has finished on main.
  #    WHY workflow_run and not `push`: CD only ever ships code CI approved. A plain `push`
  #    trigger would start CD at the same time as CI, before anyone knows if the code works.
  #    `completed` also fires when CI FAILED, so both jobs below check CI's result first.
  #    NOTE: GitHub always reads this file from the main branch, so changes to cd.yml only
  #    take effect once they are on main.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # 2. A "Run workflow" button in the Actions tab, for manual runs. (CHAPTER 11: rollback uses it.)
  #    image_tag EMPTY: build main's newest commit WITHOUT waiting for CI (use it only for a commit
  #      whose CI run is green), then deploy it.
  #    image_tag SET (e.g. 1a2b3c4): skip publish and deploy that EXISTING image: a rollback to an
  #      older version, or a redeploy of the current one. The image must already be in ECR.
  #    environment: only "dev" exists today. A choice list, so nobody can type a wrong name.
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        type: choice
        options: [dev]
        default: dev
      image_tag:
        description: "Existing image tag (git SHA) to deploy: rollback / redeploy. Empty = build main and deploy it."
        type: string
        required: false
        default: ""
      # allow_older_infra: the deploy guard (28b) refuses infrastructure code OLDER than the commit
      #   CD applied last. Tick it ONLY for a deliberate infra rollback (it deletes what newer commits
      #   added). An app rollback never needs it: image_tag keeps main's newest infrastructure code.
      allow_older_infra:
        description: "Deliberate INFRA rollback: allow infrastructure code older than the deployed commit (deletes newer resources)."
        type: boolean
        required: false
        default: false

# 3. What the run's GitHub key (GITHUB_TOKEN, given to every run) may do. Not listed = not allowed.
#    id-token: write -> the job may ask GitHub for an OIDC token: a short-lived, signed ID card that
#      says "I am a job of repo X on branch main" (or "... in environment dev"). AWS swaps it for
#      temporary keys (steps 12, 28). Without it there is no ID card, and the AWS login fails. It
#      does NOT allow writing to the repo; "write" only means "may create an ID card".
#    contents: read -> lets actions/checkout download the code. Nothing here writes to the repo.
permissions:
  id-token: write
  contents: read

env:
  # 4. The AWS region (the area of AWS data centres we use). Same as the Pulumi stack
  #    (infra/Pulumi.dev.yaml, aws:region).
  AWS_REGION: us-east-1
  # 5. The three ECR repositories (infra/src/registry.ts). The publish role may push ONLY here.
  API_REPO_NAME: minitickets-dev-api
  WEB_REPO_NAME: minitickets-dev-web
  WORKER_REPO_NAME: minitickets-dev-worker
  # 5b. The worker Lambda (S1c, infra/src/jobs/worker-lambda.ts), checked after the deploy (37).
  WORKER_FUNCTION_NAME: minitickets-dev-worker
  TICKET_FUNCTION_NAME: minitickets-dev-tickets
  # 6. The SSM parameter (a named value stored in AWS) that says which image tag is deployed
  #    (infra/src/release.ts). The deploy role may write ONLY this one.
  IMAGE_TAG_PARAMETER: /minitickets/dev/image-tag
  # 6b. The SSM parameter with the commit whose infrastructure code CD applied last (release.ts 2b).
  #     The deploy guard (28b) reads it; the end of the deploy (38b) writes it.
  DEPLOYED_COMMIT_PARAMETER: /minitickets/dev/deployed-commit

jobs:
  # CHAPTER 3: publish = build the api, web and worker images ONCE and store them in ECR.
  publish:
    # 7. Run only when it is safe to ship:
    #    - a manual run (workflow_dispatch) from main WITHOUT image_tag, OR
    #    - CI finished with "success" AND that CI run was started by a PUSH.
    #    WHY event == 'push': `branches: [main]` above only checks the BRANCH NAME of the CI run.
    #      A pull request from a fork (someone else's copy of our repo) whose branch happens to be
    #      called "main" would match too, and we would build a stranger's code. Only pushes come
    #      from our own repo.
    #    WHY image_tag == '': a manual run WITH a tag deploys an image that already exists, so
    #      there is nothing to build (the deploy job still runs, see 19).
    #    (The AWS role refuses anything but main of our repo anyway; this check makes the run
    #    show "skipped" instead of failing.)
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
       inputs.image_tag == '') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')

    # 7b. At most one publish per commit at a time; a second one WAITS (it is not cancelled).
    #    WHY: two runs for the same commit (e.g. a re-run while the first is still busy) could both
    #    see "tag missing" and both push; the slower one would fail, because ECR accepts each tag
    #    only once. Waiting, the second one sees the tag and skips. Different commits still run side
    #    by side. (The deploy job has its own group, see 21, so a rollback never waits for this.)
    concurrency:
      group: cd-publish-${{ github.event.workflow_run.head_sha || github.sha }}
      cancel-in-progress: false

    # 8. A GitHub computer (runner) with an ARM64 processor.
    #    WHY: our containers on AWS run on ARM64, and an image only runs on the processor type it
    #    was built for. On this runner Docker builds ARM natively, at full speed.
    #    The alternative is ubuntu-latest (x86) + docker/setup-qemu-action, which SIMULATES an
    #    ARM processor in software: it works, but `pnpm install` and `next build` get several times
    #    slower (minutes instead of seconds per stage).
    #    ARM runners are free for PUBLIC repos (this one is). If the repo turns private, check
    #    GitHub's current runner pricing, or switch to ubuntu-latest + setup-qemu-action.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20

    # 8b. Hand the tag to the deploy job (step 11 computes it).
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      # 9. Fail early, with a clear message, if the one-time setup was not done.
      #    WHY: without the variable, the AWS step below fails with a vague "could not load
      #    credentials". See the setup steps in docs/handbook/PENDING.md (Step 12a).
      - name: Check setup
        env:
          ROLE_ARN: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::Repo variable AWS_PUBLISH_ROLE_ARN is not set. Set it to: cd infra && pulumi stack output publishRoleArn"
            exit 1
          fi

      # 10. Check out (download) the EXACT commit CI tested.
      #     WHAT: workflow_run.head_sha is the commit the CI run tested. For a manual run there
      #       is no CI run, so it falls back to github.sha (the newest commit on main).
      #     WHY: by the time CD starts, someone may have pushed again. Checking out "main" would
      #       build that NEWER commit, which CI has not approved yet.
      - name: Check out the commit CI tested
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # 11. The image tag: the short git SHA (7 characters), the same format as
      #     `pnpm images:push` (scripts/push-images.sh). Never "latest".
      #     WHY: a SHA names exactly one commit, so any running container can be traced back to
      #     its code. The ECR repositories are IMMUTABLE: a tag can be pushed only once.
      - name: Compute the image tag
        id: tag
        run: echo "tag=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      # 12. Log in to AWS with OIDC: no stored access keys.
      #     WHAT: the action asks GitHub for the OIDC token (the signed ID card, allowed by
      #       `id-token: write`) and shows it to AWS STS (the AWS service that hands out temporary
      #       keys). AWS checks that GitHub really signed it, and the role's trust conditions: the
      #       card is made for AWS (aud = sts.amazonaws.com) and comes from main of our repo
      #       (sub = repo:<owner>/<repo>:ref:refs/heads/main; see infra/src/cicd.ts). Then it returns
      #       keys that work for 1 hour.
      #     WHY a repo VARIABLE (vars.), not a SECRET: a role ARN (Amazon Resource Name, the full
      #       address of something in AWS) is just an address, not a password. Knowing it does not
      #       let anyone use it (the trust conditions decide that). Variables are visible in logs,
      #       which makes debugging easier; secrets are for things that grant access on their own.
      #     role-session-name: a label that shows up in AWS CloudTrail (AWS's log of who did what),
      #       so each AWS call can be traced back to one GitHub run.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
          role-session-name: gh-publish-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      # 13. Log Docker in to our ECR registry.
      #     WHAT: gets a 12-hour password from AWS (ecr:GetAuthorizationToken) and runs `docker login`.
      #     WHY: ECR repositories are private. Also gives `registry`, the address of our image
      #       storage, e.g. 123456789012.dkr.ecr.us-east-1.amazonaws.com.
      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 14. Set up Buildx, Docker's modern builder.
      #     WHY: the default builder cannot use the GitHub Actions cache (storage that GitHub keeps
      #     between runs, step 16); Buildx can. It also gives the `imagetools` command used in step 15.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 15. Does each image already exist in ECR with this tag?
      #     WHAT: `imagetools inspect` reads the image's manifest (its table of contents) from ECR.
      #       found      -> <service>_exists=true and its digest (a fingerprint of the content);
      #                     that image is skipped
      #       not found  -> <service>_exists=false (that image is built and pushed)
      #       any other error (e.g. not allowed) -> stop here; better than guessing.
      #     WHY: tags are immutable. Re-running a run, or a manual run for a commit that was
      #       already published, must SUCCEED without pushing again (the push would be refused).
      - name: Check which images already exist
        id: check
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # check <service> <repo name>: writes <service>_exists (and <service>_digest if found)
          check() {
            SERVICE="$1"
            REF="$REGISTRY/$2:$TAG"
            if OUT="$(docker buildx imagetools inspect "$REF" --format '{{.Manifest.Digest}}' 2>&1)"; then
              echo "${SERVICE}_exists=true" >> "$GITHUB_OUTPUT"
              echo "${SERVICE}_digest=$OUT" >> "$GITHUB_OUTPUT"
              echo "$REF already exists ($OUT): skipping its build."
            elif [[ "$OUT" == *"not found"* ]]; then
              echo "${SERVICE}_exists=false" >> "$GITHUB_OUTPUT"
              echo "$REF is not in ECR yet: it will be built and pushed."
            else
              echo "::error::Could not check $REF: $OUT"
              exit 1
            fi
          }
          check api "$API_REPO_NAME"
          check web "$WEB_REPO_NAME"
          check worker "$WORKER_REPO_NAME"

      # 16. Build the api image for linux/arm64 and push it (only if step 15 did not find it).
      #     push: true = upload to ECR right after the build.
      #     provenance: false = no extra "attestation" (a signed note about how the image was
      #       built), so each tag is one plain ARM64 image (the same as scripts/push-images.sh).
      #     cache-from / cache-to (GitHub Actions cache): reuse unchanged layers (the saved result
      #       of each Dockerfile step, like the pnpm install) from the previous run. mode=max also
      #       stores the layers of the build stages that are not part of the final image.
      #       scope "api-arm64": CI's docker job builds x86 images with scope "api"; a separate
      #       name stops the two processor types from overwriting each other's cache.
      - name: Build and push api
        id: build_api
        if: steps.check.outputs.api_exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/arm64
          provenance: false
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.API_REPO_NAME }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=api-arm64
          cache-to: type=gha,mode=max,scope=api-arm64

      # 17. The same for web. No NEXT_PUBLIC_API_URL build-arg: empty means "call /trpc on the
      #     same address as the page" (see apps/web/Dockerfile step 6), so one image fits every
      #     environment. That is what makes "build once, promote" possible for web.
      - name: Build and push web
        id: build_web
        if: steps.check.outputs.web_exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/arm64
          provenance: false
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.WEB_REPO_NAME }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=web-arm64
          cache-to: type=gha,mode=max,scope=web-arm64

      # 17b. The worker image (S1c): the Lambda that sends the booking emails (apps/worker/Dockerfile).
      #      provenance: false matters MORE here: Lambda accepts only a plain single-platform image.
      #        An image index with an attestation (what provenance adds) is refused when the
      #        function is created or updated ("image manifest ... media type not supported").
      #      platforms linux/arm64: the function's architecture is arm64 (Graviton), the same as ECS.
      - name: Build and push worker
        id: build_worker
        if: steps.check.outputs.worker_exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          platforms: linux/arm64
          provenance: false
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.WORKER_REPO_NAME }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=worker-arm64
          cache-to: type=gha,mode=max,scope=worker-arm64

      # 18. Write what was published to the job summary (the run's page in the Actions tab).
      #     WHAT: for each image: the tag, the digest, and whether it was pushed now or skipped.
      #     WHY: the tag is a name; the digest (sha256 fingerprint of the content) is the exact
      #       content. The digest comes from the build (pushed now) or from step 15 (already in ECR).
      - name: Write job summary
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.tag.outputs.tag }}
          COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
          API_DIGEST: ${{ steps.build_api.outputs.digest || steps.check.outputs.api_digest }}
          WEB_DIGEST: ${{ steps.build_web.outputs.digest || steps.check.outputs.web_digest }}
          WORKER_DIGEST: ${{ steps.build_worker.outputs.digest || steps.check.outputs.worker_digest }}
          API_STATUS: ${{ steps.check.outputs.api_exists == 'true' && 'already in ECR (skipped)' || 'pushed now' }}
          WEB_STATUS: ${{ steps.check.outputs.web_exists == 'true' && 'already in ECR (skipped)' || 'pushed now' }}
          WORKER_STATUS: ${{ steps.check.outputs.worker_exists == 'true' && 'already in ECR (skipped)' || 'pushed now' }}
        run: |
          {
            echo "## Published images"
            echo
            echo "Commit: \`$COMMIT\` (tag \`$TAG\`)"
            echo
            echo "| Image | Tag | Digest | Status |"
            echo "|---|---|---|---|"
            echo "| \`$REGISTRY/$API_REPO_NAME\` | \`$TAG\` | \`$API_DIGEST\` | $API_STATUS |"
            echo "| \`$REGISTRY/$WEB_REPO_NAME\` | \`$TAG\` | \`$WEB_DIGEST\` | $WEB_STATUS |"
            echo "| \`$REGISTRY/$WORKER_REPO_NAME\` | \`$TAG\` | \`$WORKER_DIGEST\` | $WORKER_STATUS |"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

  # JOB deploy (CHAPTERS 4-10): wait for a human's approval, then put the published images live.
  deploy:
    needs: publish

    # 19. When to deploy.
    #     needs.publish.result 'success' OR 'skipped':
    #       By default GitHub SKIPS a job when a job it `needs` was skipped. A rollback run SKIPS
    #       publish on purpose (image_tag given, see 7). `!cancelled()` switches that default off,
    #       so we must then list ourselves which results are fine. 'failure' and 'cancelled' are
    #       not in the list: NEVER deploy after a failed publish.
    #     `!cancelled()`, not `always()`: always() would even run this job after someone pressed
    #       "Cancel workflow"; !cancelled() runs it in every case EXCEPT that one.
    #     The same "is it safe to ship" check as publish (7), repeated: publish is ALSO 'skipped'
    #       when CI failed or the run is not from main, and that must not deploy.
    if: >-
      !cancelled() &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped') &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push'))

    # CHAPTER 4: wait until a human clicks "Approve".
    # 20. The GitHub environment "dev" (Settings -> Environments).
    #     WHAT it gives: (a) the job WAITS until a required reviewer (you) clicks "Approve";
    #       (b) the job's OIDC ID card then says "sub = ...:environment:dev" ("sub" = the "who am I"
    #       line), and ONLY that card may use the deploy role (infra/src/cicd.ts step 8).
    #       So no approval = no AWS keys.
    #     A workflow_run start has no inputs, so the default "dev" applies.
    environment: ${{ inputs.environment || 'dev' }}

    # 21. One deploy per environment at a time; NEVER cancel a running one.
    #     WHY no cancelling: a deploy stopped halfway (e.g. between the migration and phase B, or in
    #       the middle of `pulumi up`) leaves a half-changed environment. A slow deploy is better
    #       than a half-finished one. A newer deploy waits for the running one, then starts.
    #     GitHub keeps at most ONE waiting run per group: if a third one arrives, the older WAITING
    #       one is cancelled (never the running one). Fine: the newest commit is the one we want.
    #     A second safety net: Pulumi Cloud (where Pulumi keeps its records) LOCKS the stack during
    #       an update. A second `pulumi up` (from CD, or from your laptop during a CD deploy) fails at
    #       once with "the stack is currently locked", without changing anything.
    concurrency:
      group: cd-deploy-${{ inputs.environment || 'dev' }}
      cancel-in-progress: false

    # 22. A normal x86 runner is fine: nothing is built here (the images exist already).
    #     110 minutes: turning everything on can take RDS (the database) 10-15 min + CloudFront (the
    #     servers close to visitors) 15-25 min, plus the migration and two waits. The deploy role's
    #     keys last 2 hours (cicd.ts step 9).
    runs-on: ubuntu-24.04
    timeout-minutes: 110

    steps:
      # CHAPTER 5: safety checks. Check the setup, the tag and the current state. Nothing in AWS changes yet.
      # 23. Fail early, with clear messages, if the one-time setup was not done (PENDING.md, Step 12b).
      #     The secret's VALUE never reaches this script: GitHub only tells us whether it is empty.
      - name: Check setup
        env:
          ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          HAS_PULUMI_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN != '' }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::Repo variable AWS_DEPLOY_ROLE_ARN is not set. Set it to: cd infra && pulumi stack output deployRoleArn"
            exit 1
          fi
          if [ "$HAS_PULUMI_TOKEN" != "true" ]; then
            echo "::error::Secret PULUMI_ACCESS_TOKEN is not set (environment 'dev' or repo). Create one at app.pulumi.com -> Personal access tokens."
            exit 1
          fi

      # 24. Which tag to deploy, and check that it looks like a git SHA.
      #     image_tag (rollback / redeploy) if given, else the tag publish just pushed.
      #     WHY through `env:` and never ${{ }} inside `run:`: GitHub pastes a ${{ }} into the script
      #       as text BEFORE bash runs it, so a "tag" like `x"; rm -rf ~; "` would become code
      #       (script injection). From an env var it stays text, and the pattern check below (a
      #       regex) refuses it anyway.
      - name: Choose the image tag
        id: tag
        env:
          TAG: ${{ inputs.image_tag || needs.publish.outputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "::error::Image tag '$TAG' is not a git SHA (7-40 lowercase hex characters)."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Deploying image tag $TAG"

      # 25. Check out the infrastructure code + the committed config to deploy WITH.
      #     workflow_run: the commit CI tested (= the commit the image was built from).
      #     manual run: main's newest commit. For a rollback that means: TODAY's infrastructure and
      #       switches, with an OLDER app image. That is what "roll back the app" should mean.
      #     fetch-depth 0: the WHOLE history, not just this one commit. The deploy guard (28b) must
      #       ask git "is this commit older than the deployed one?", which needs both in the history.
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      # 26. Node + pnpm, and the infra package's libraries (the Pulumi program is TypeScript).
      #     ORDER MATTERS: installing libraries runs other people's code (their install scripts).
      #     It happens BEFORE the job holds any AWS keys or Pulumi token (28-29), so that code has
      #     nothing to steal.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install the infra dependencies
        run: pnpm install --frozen-lockfile --filter @minitickets/infra

      # 27. The Pulumi CLI, pinned to the version used locally (`pulumi version`), so CD and your
      #     laptop run the same engine. Bump both together.
      - name: Install Pulumi
        run: |
          curl -fsSL https://get.pulumi.com | sh -s -- --version 3.267.0
          echo "$HOME/.pulumi/bin" >> "$GITHUB_PATH"

      # 28. Log in to AWS with OIDC, as the DEPLOY role (not the publish role).
      #     The role's trust policy (its "who may use me" rule) accepts only
      #     "sub = <repo>:environment:dev" (infra/src/cicd.ts step 8). GitHub writes that only for
      #     this job, and only after the approval (20).
      #     role-duration-seconds 7200: 2 hours, the role's maximum (see 22).
      - name: Configure AWS credentials (OIDC, deploy role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gh-deploy-${{ github.run_id }}
          role-duration-seconds: 7200
          aws-region: ${{ env.AWS_REGION }}

      # 28b. THE DEPLOY GUARD: never apply OLD infrastructure code. Before ANY `pulumi` command.
      #      INCIDENT (2026-10-15): a run for commit 6ea9575 waited days for approval. Approved later,
      #        it ran `pulumi up` with that commit's OLD infrastructure code, and Pulumi (which makes
      #        AWS match the code it is given) deleted 10 resources that newer commits had added.
      #        Repair: targeted local `pulumi up`s (docs/20-deploy-day.md, 3.11).
      #      WHAT it checks (scripts/deploy-guard.sh; tests in scripts/deploy-guard.test.ts):
      #        a. runs CI started: is this still main's NEWEST commit? No = "superseded", refuse.
      #           (GitHub reads cd.yml from main, but each run keeps the commit it was started for.)
      #        b. every run: is this commit OLDER than SSM /minitickets/dev/deployed-commit (an
      #           ancestor of it in git)? Yes = refuse, unless a manual run sets allow_older_infra.
      #      App rollbacks keep working: they check out main's newest commit (25), never older code.
      #      FAILS CLOSED: if SSM cannot be read (no permission, network), the deploy stops. Only a
      #        parameter that does not exist yet counts as "nothing recorded" (the guard lets it pass).
      #      git fetch: main's newest commit NOW (after the approval, which may be days after the start).
      #      The guard script itself comes from THAT commit, not from the checked-out one: an old
      #        commit carries an old guard, or none at all (6ea9575 has no scripts/deploy-guard.sh).
      - name: "Deploy guard: refuse old or superseded infrastructure code"
        id: guard
        env:
          IS_CI_RUN: ${{ github.event_name == 'workflow_run' }}
          ALLOW_OLDER: ${{ inputs.allow_older_infra == true }}
        run: |
          CHECKED="$(git rev-parse HEAD)"
          git fetch --quiet --no-tags origin main
          git show FETCH_HEAD:scripts/deploy-guard.sh > "$RUNNER_TEMP/deploy-guard.sh"
          MAIN_TIP=""
          if [ "$IS_CI_RUN" = "true" ]; then MAIN_TIP="$(git rev-parse FETCH_HEAD)"; fi

          if ! RECORDED="$(aws ssm get-parameter --name "$DEPLOYED_COMMIT_PARAMETER" --query Parameter.Value --output text 2>&1)"; then
            if [[ "$RECORDED" == *ParameterNotFound* ]]; then
              RECORDED=none
            else
              echo "::error::Cannot read SSM $DEPLOYED_COMMIT_PARAMETER: $RECORDED"
              echo "::error::First deploy with the guard? Bootstrap the parameter + deploy policy once (docs/20-deploy-day.md, 3.11)."
              exit 1
            fi
          fi

          CHECKED="$CHECKED" MAIN_TIP="$MAIN_TIP" RECORDED="$RECORDED" ALLOW_OLDER="$ALLOW_OLDER" \
            bash "$RUNNER_TEMP/deploy-guard.sh"

      # 29. Log in to Pulumi Cloud (where Pulumi keeps its records of what it built, and its lock)
      #     and pick the dev stack (our one copy of the infrastructure).
      #     The token is given to THIS step only; `pulumi login` stores it for the later steps.
      - name: Pulumi login
        working-directory: infra
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: |
          pulumi login
          pulumi stack select dev

      # 30. Does <tag> exist in ALL THREE repositories? Fail early, before anything changes.
      #     WHY: a rollback to a tag that was never published (typo), or that ECR already deleted
      #     (ECR deletes old images automatically: lifecycle rules in infra/src/registry.ts), would
      #     otherwise fail much later, as containers that cannot download their image.
      #     NOTE (S1c): tags published before S1c have no worker image, so a rollback to one of them
      #     stops here. Roll back to a tag from S1c on, or push that commit's worker image by hand.
      - name: Check the image exists in ECR
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # P4: an older worker image has no ticket entry point. Refuse it before applying infra.
          if ! git cat-file -e "$TAG:apps/worker/src/ticket-lambda.ts" 2>/dev/null; then
            echo "::error::Image $TAG predates P4 tickets. Choose a P4-or-newer tag."
            exit 1
          fi
          for REPO in "$API_REPO_NAME" "$WEB_REPO_NAME" "$WORKER_REPO_NAME"; do
            if ! aws ecr describe-images --repository-name "$REPO" --image-ids imageTag="$TAG" \
                 --query 'imageDetails[0].imageDigest' --output text; then
              echo "::error::$REPO:$TAG is not in ECR. Publish it first (push to main), or pick another tag."
              exit 1
            fi
          done

      # 31. Read the current state: what the COMMITTED config wants, and what runs now.
      #     compute_enabled / entry_enabled: from the committed infra/Pulumi.dev.yaml (missing = false,
      #       the same default as infra/index.ts).
      #     current_tag: SSM /minitickets/dev/image-tag, the version running now ("none" = never
      #       deployed). Empty if that image is no longer in ECR (then phase A cannot keep it, 33).
      #     web_existed: did the web service exist BEFORE this run? (Needed for the restart in 37.)
      #     worker_new_tag (S1c): "true" when the current tag has NO worker image (the first deploy
      #       with a worker: tags published before S1c have none). Phase A then
      #       starts the worker with the NEW tag (33); api and web still keep the current one.
      #     Also REFUSES committed image-tag overrides: apiImageTag / webImageTag in the committed
      #       file would silently keep the services on that tag (infra/index.ts 9b), and
      #       migrationImageTag / workerImageTag must only ever come from the command line (33).
      - name: Read the committed config and the current state
        id: state
        working-directory: infra
        run: |
          for KEY in apiImageTag webImageTag migrationImageTag workerImageTag; do
            if pulumi config get "$KEY" > /dev/null 2>&1; then
              echo "::error::$KEY is set in the committed infra/Pulumi.dev.yaml. Remove it (pulumi config rm $KEY), commit, push."
              exit 1
            fi
          done

          COMPUTE="$(pulumi config get computeEnabled 2>/dev/null || echo false)"
          ENTRY="$(pulumi config get entryEnabled 2>/dev/null || echo false)"

          if ! CURRENT="$(aws ssm get-parameter --name "$IMAGE_TAG_PARAMETER" --query Parameter.Value --output text)"; then
            echo "::error::Cannot read SSM $IMAGE_TAG_PARAMETER. Run 'pulumi up' locally once for Step 12b's new resources (PENDING.md setup)."
            exit 1
          fi
          if [ "$CURRENT" != "none" ]; then
            for REPO in "$API_REPO_NAME" "$WEB_REPO_NAME"; do
              if ! aws ecr describe-images --repository-name "$REPO" --image-ids imageTag="$CURRENT" > /dev/null 2>&1; then
                echo "::warning::The current tag $CURRENT is no longer in $REPO. Phase A will use the new tag for the services too."
                CURRENT=""
                break
              fi
            done
          fi

          WORKER_NEW_TAG=false
          if [ -n "$CURRENT" ] && [ "$CURRENT" != "none" ] && \
             ! aws ecr describe-images --repository-name "$WORKER_REPO_NAME" --image-ids imageTag="$CURRENT" > /dev/null 2>&1; then
            echo "::notice::The current tag $CURRENT has no worker image (published before S1c). Phase A starts the worker with the new tag."
            WORKER_NEW_TAG=true
          fi

          # P4 bootstrap: current worker images may exist but lack the new ticket handler.
          # Promote the published worker early in phase A (neither consumer uses SQL).
          if [ -n "$CURRENT" ] && [ "$CURRENT" != "none" ] && \
             ! git cat-file -e "$CURRENT:apps/worker/src/ticket-lambda.ts" 2>/dev/null; then
            WORKER_NEW_TAG=true
          fi

          WEB_SERVICE="$(pulumi stack output webServiceName 2>/dev/null || true)"
          if [ -n "$WEB_SERVICE" ] && [ "$WEB_SERVICE" != "null" ]; then WEB_EXISTED=true; else WEB_EXISTED=false; fi

          {
            echo "compute_enabled=$COMPUTE"
            echo "entry_enabled=$ENTRY"
            echo "current_tag=$CURRENT"
            echo "web_existed=$WEB_EXISTED"
            echo "worker_new_tag=$WORKER_NEW_TAG"
          } >> "$GITHUB_OUTPUT"
          echo "computeEnabled=$COMPUTE entryEnabled=$ENTRY current tag='$CURRENT' web existed=$WEB_EXISTED worker new tag=$WORKER_NEW_TAG"

      # CHAPTER 5, side path: the containers are switched off. Only apply the committed switches.
      # 32. computeEnabled is false in the committed config: nothing to deploy an image TO.
      #     Run a plain `pulumi up` so AWS matches the committed file. THIS is how "everything off"
      #     works (and "data on only"): change the switches, commit, push, approve. No migration, no
      #     SSM write: the deployed tag stays what it was, ready for the next "on".
      #     The remaining steps check compute_enabled == 'true' and are skipped; the summary (40) says so.
      - name: "Compute off: apply the committed config (pulumi up)"
        id: apply_off
        if: steps.state.outputs.compute_enabled != 'true'
        working-directory: infra
        run: pulumi up --yes --non-interactive

      # CHAPTER 6: phase A = prepare everything except the new app version.
      # 33. PHASE A: everything EXCEPT the new app version.
      #     WHAT: `pulumi up --config migrationImageTag=<new>`: the migration task definition (the
      #       recipe ECS uses to start the migration container) gets the NEW image; the services keep
      #       the CURRENT tag from SSM, so they do not change. Anything missing is created here too
      #       (database, cluster, load balancer, ... after an "everything on" commit), and this
      #       commit's infrastructure changes are applied, BEFORE the new app version.
      #     FIRST DEPLOY (SSM still "none", or the current image is gone): there is no current version
      #       to keep, so the new tag is written to SSM first and the services start with it right away.
      #       Their first seconds may hit a database without tables (the migration runs next). That is
      #       fine: requests fail with a 500, /health stays green (it does not touch the database), and
      #       the next step creates the tables.
      #     WORKER (S1c): it normally keeps the current tag too, like the services. Only when the
      #       current tag has NO worker image (31: the first deploy with a worker) does it get the new
      #       tag here, via --config workerImageTag. That is safe: the worker never touches the
      #       database, so it does not wait for the migration.
      #     --config also writes the value into this runner's copy of Pulumi.dev.yaml. That copy is
      #       thrown away with the runner; it is never committed. (So phase B, 36, keeps the values.)
      - name: "Phase A: pulumi up (migration image = new, services unchanged)"
        id: phase_a
        if: steps.state.outputs.compute_enabled == 'true'
        working-directory: infra
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          CURRENT: ${{ steps.state.outputs.current_tag }}
          WORKER_NEW_TAG: ${{ steps.state.outputs.worker_new_tag }}
        run: |
          if [ -z "$CURRENT" ] || [ "$CURRENT" = "none" ]; then
            echo "No running version to keep: services start with $TAG directly."
            aws ssm put-parameter --name "$IMAGE_TAG_PARAMETER" --value "$TAG" --overwrite > /dev/null
          fi
          WORKER_CONFIG=()
          if [ "$WORKER_NEW_TAG" = "true" ]; then WORKER_CONFIG=(--config workerImageTag="$TAG"); fi
          pulumi up --yes --non-interactive --config migrationImageTag="$TAG" "${WORKER_CONFIG[@]}"

      # CHAPTER 7: migrate = update the database with the NEW code, while the OLD app keeps running.
      # 34. Migrate: run the NEW image's migrations as a one-off ECS task and wait for it.
      #     scripts/run-migrations.sh is the SAME script you run by hand (`pnpm infra:migrate`): it
      #     starts the migration task definition, waits, prints its logs, and exits with the
      #     container's exit code. Exit code != 0 = this step fails and the deploy STOPS here: the
      #     services still run the old version, untouched. (Fix the migration, push, deploy again.)
      - name: Run the database migration (new image)
        id: migrate
        if: steps.state.outputs.compute_enabled == 'true'
        run: bash scripts/run-migrations.sh

      # CHAPTER 8: phase B = switch the app to the new version.
      # 35. PHASE B, part 1: record the new version.
      #     a. SSM image-tag = <tag>: from now on EVERY `pulumi up` (CD or local) runs this tag.
      #     b. ECR: add the tag "deployed-<tag>" to all three images (api, web, worker). It is a second NAME for the SAME
      #        image (same digest), so ECR's automatic clean-up keeps it longer (the last 10 deployed,
      #        see infra/src/registry.ts): these are the rollback targets.
      #        The repositories are IMMUTABLE, so an existing deployed- tag cannot be written again:
      #        skip it if it exists (a redeploy, or a rollback to a version deployed before).
      #        HOW: read the image's manifest (its table of contents) and put it again under the new
      #        tag. Same manifest bytes = same digest; we check that, so we never make a NEW image.
      - name: "Phase B: write the new tag to SSM and mark the images as deployed"
        id: record
        if: steps.state.outputs.compute_enabled == 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          aws ssm put-parameter --name "$IMAGE_TAG_PARAMETER" --value "$TAG" --overwrite > /dev/null
          echo "SSM $IMAGE_TAG_PARAMETER = $TAG"

          for REPO in "$API_REPO_NAME" "$WEB_REPO_NAME" "$WORKER_REPO_NAME"; do
            if aws ecr describe-images --repository-name "$REPO" --image-ids imageTag="deployed-$TAG" > /dev/null 2>&1; then
              echo "$REPO: deployed-$TAG already exists, skipping."
              continue
            fi
            DIGEST="$(aws ecr describe-images --repository-name "$REPO" --image-ids imageTag="$TAG" --query 'imageDetails[0].imageDigest' --output text)"
            MANIFEST="$(aws ecr batch-get-image --repository-name "$REPO" --image-ids imageTag="$TAG" --query 'images[0].imageManifest' --output text)"
            MEDIA_TYPE="$(aws ecr batch-get-image --repository-name "$REPO" --image-ids imageTag="$TAG" --query 'images[0].imageManifestMediaType' --output text)"
            NEW_DIGEST="$(aws ecr put-image --repository-name "$REPO" --image-tag "deployed-$TAG" \
              --image-manifest "$MANIFEST" --image-manifest-media-type "$MEDIA_TYPE" \
              --query 'image.imageId.imageDigest' --output text)"
            if [ "$NEW_DIGEST" != "$DIGEST" ]; then
              echo "::error::$REPO: deployed-$TAG got digest $NEW_DIGEST, expected $DIGEST (the manifest changed on the way)."
              exit 1
            fi
            echo "$REPO: deployed-$TAG -> $DIGEST"
          done

      # 36. PHASE B, part 2: `pulumi up` again. It reads the NEW tag from SSM, so the api and web task
      #     definitions get a new revision (a new version of the recipe) with the new image, and ECS
      #     starts a rolling update (new containers first; old ones stop once the new ones are healthy).
      #     Same --config as phase A, so the migration task definition stays on the new tag too.
      #     Nothing else should change here: phase A already applied every other change.
      - name: "Phase B: pulumi up (services roll to the new tag)"
        id: phase_b
        if: steps.state.outputs.compute_enabled == 'true'
        working-directory: infra
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: pulumi up --yes --non-interactive --config migrationImageTag="$TAG"

      # CHAPTER 9: verify = is the new version really running, and does it answer?
      # 37. Wait until the services are stable, and check they REALLY run the new revision.
      #     a. `aws ecs wait services-stable`: asks every 15 s, up to 10 minutes, until each service
      #        has exactly the number of containers it wants, all from one revision.
      #     b. If the web service did not exist before this run (first deploy, or entry just turned
      #        on), the api's containers started BEFORE the internal name "web" existed. (Service
      #        Connect, Step 11h, is our services' internal phone book; a container only learns the
      #        names that existed when it started.) So the api cannot call web's revalidate hook (the
      #        "refresh your cached pages" call). One forced restart of the api fixes it; wait again.
      #     c. "Stable" is not "deployed": if the new containers keep failing, ECS's circuit breaker
      #        (an automatic "this is not working, go back" switch) ROLLS BACK to the previous
      #        revision, and that is stable too. So compare each service's revision with the one
      #        Pulumi just registered; different = rolled back = fail.
      #     d. The worker Lambda (S1c): its image must end in :<tag>, the function must be Active with
      #        its last update Successful, and its queue trigger (event source mapping) Enabled.
      #        (`pulumi up` already waited for the update; this proves WHAT is running.)
      - name: Wait for the services to be stable
        id: wait
        if: steps.state.outputs.compute_enabled == 'true'
        working-directory: infra
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          ENTRY: ${{ steps.state.outputs.entry_enabled }}
          WEB_EXISTED: ${{ steps.state.outputs.web_existed }}
        run: |
          CLUSTER="$(pulumi stack output clusterName)"
          API_SERVICE="$(pulumi stack output apiServiceName)"
          WEB_SERVICE="$(pulumi stack output webServiceName)"
          SERVICES="$API_SERVICE"
          if [ "$ENTRY" = "true" ]; then SERVICES="$API_SERVICE $WEB_SERVICE"; fi

          echo "Waiting for: $SERVICES"
          # shellcheck disable=SC2086  # SERVICES is a space-separated list on purpose
          aws ecs wait services-stable --cluster "$CLUSTER" --services $SERVICES

          if [ "$ENTRY" = "true" ] && [ "$WEB_EXISTED" != "true" ]; then
            echo "The web service is new: restarting the api once so it learns the name 'web' (Step 11h)."
            aws ecs update-service --cluster "$CLUSTER" --service "$API_SERVICE" --force-new-deployment > /dev/null
            aws ecs wait services-stable --cluster "$CLUSTER" --services "$API_SERVICE"
          fi

          # check_revision <service> <stack output with the expected task definition ARN>
          check_revision() {
            EXPECTED="$(pulumi stack output "$2")"
            RUNNING="$(aws ecs describe-services --cluster "$CLUSTER" --services "$1" --query 'services[0].taskDefinition' --output text)"
            if [ "$RUNNING" != "$EXPECTED" ]; then
              echo "::error::$1 runs $RUNNING, but this deploy registered $EXPECTED. ECS rolled the deploy back (deployment circuit breaker): the new tasks did not become healthy."
              exit 1
            fi
            echo "$1 runs $RUNNING"
          }
          check_revision "$API_SERVICE" apiTaskDefinitionArn
          if [ "$ENTRY" = "true" ]; then check_revision "$WEB_SERVICE" webTaskDefinitionArn; fi

          # P4: both Lambda functions run the same immutable worker image, different commands.
          for FUNCTION in "$WORKER_FUNCTION_NAME" "$TICKET_FUNCTION_NAME"; do
            read -r IMAGE STATE UPDATE <<< "$(aws lambda get-function --function-name "$FUNCTION" \
              --query '[Code.ImageUri, Configuration.State, Configuration.LastUpdateStatus]' --output text)"
            if [ "${IMAGE##*:}" != "$TAG" ] || [ "$STATE" != "Active" ] || [ "$UPDATE" != "Successful" ]; then
              echo "::error::$FUNCTION: image $IMAGE, state $STATE, last update $UPDATE (expected :$TAG, Active, Successful)."
              exit 1
            fi
            MAPPING="$(aws lambda list-event-source-mappings --function-name "$FUNCTION" \
              --query 'EventSourceMappings[0].State' --output text)"
            if [ "$MAPPING" != "Enabled" ]; then
              echo "::error::$FUNCTION's queue trigger is '$MAPPING', expected Enabled: nothing reads the jobs queue."
              exit 1
            fi
            echo "$FUNCTION runs $IMAGE ($STATE, $UPDATE), queue trigger $MAPPING"
          done
          COMMAND="$(aws lambda get-function-configuration --function-name "$TICKET_FUNCTION_NAME" \
            --query 'ImageConfigResponse.ImageConfig.Command[0]' --output text)"
          if [ "$COMMAND" != "ticket-lambda.handler" ]; then
            echo "::error::Ticket Lambda command is $COMMAND, expected ticket-lambda.handler"
            exit 1
          fi

      # 38. Smoke test: is the app really answering, from the outside, through the front door?
      #     GET /                   -> 200 (OK): the web app renders (and reaches the api inside AWS)
      #     GET /trpc/events.list   -> 200 (OK): the api answers, with Postgres + Valkey behind it
      #     Up to 12 tries, 10 s apart: a new container must pass a few health checks first.
      #     WITHOUT CloudFront (cdnEnabled false), appUrl is OUR domain. Its DNS record (a CNAME:
      #       "this name is an alias for that one") is set by hand, and the load balancer's (ALB's)
      #       name changes whenever a new ALB is created. So curl connects to the ALB directly with
      #       --connect-to, but still asks for our domain: the HTTPS certificate check and the request
      #       are exactly what a visitor sends. That tests the deployed app even before DNS points at
      #       the new ALB; the summary says whether it does.
      #     With entry off there is no public URL: skipped (the summary says so).
      #     NOTE: if you limit allowedCidrs to your own IP, GitHub's runner cannot reach the ALB and
      #       this step fails. Then remove this check or allow the runner (not built).
      - name: Smoke test
        id: smoke
        if: steps.state.outputs.compute_enabled == 'true' && steps.state.outputs.entry_enabled == 'true'
        working-directory: infra
        run: |
          APP_URL="$(pulumi stack output appUrl)"
          HOST="${APP_URL#https://}"
          CONNECT_TO=()
          if [ "$(pulumi stack output appDnsRecord --json)" != "null" ]; then
            ALB="$(pulumi stack output albDnsName)"
            CONNECT_TO=(--connect-to "$HOST:443:$ALB:443")
            echo "alb=$ALB" >> "$GITHUB_OUTPUT"
            # Where does public DNS point today? (Only a note for the summary, never a failure.)
            if command -v dig > /dev/null; then
              echo "dns_target=$(dig +short CNAME "$HOST" | sed 's/\.$//')" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "app_url=$APP_URL" >> "$GITHUB_OUTPUT"

          for URL_PATH in "/" "/trpc/events.list"; do
            for TRY in $(seq 1 12); do
              CODE="$(curl -sS -o /dev/null -m 10 -w '%{http_code}' "${CONNECT_TO[@]}" "$APP_URL$URL_PATH" || true)"
              echo "GET $URL_PATH -> $CODE (try $TRY)"
              if [ "$CODE" = "200" ]; then break; fi
              if [ "$TRY" = "12" ]; then
                echo "::error::GET $APP_URL$URL_PATH answered $CODE, expected 200."
                exit 1
              fi
              sleep 10
            done
          done

      # 38b. Record this commit as the deployed one (SSM /minitickets/dev/deployed-commit), for the
      #      deploy guard (28b) of every LATER run.
      #      WHEN: as soon as this commit's `pulumi up` has STARTED (the compute-off apply, or phase A),
      #        and also if a later step failed or the run was cancelled (`always()`). WHY not only
      #        after full success: from the first `pulumi up` on, AWS may already hold resources of
      #        this commit (phase A applies all infrastructure changes BEFORE the migration). If a
      #        failed run did not record itself, an older run approved next would pass the guard and
      #        delete them: the incident again. Recording a newer commit is always safe: it only
      #        means "older code than this may not run".
      #      NOT recorded when the guard refused or a check before phase A failed: nothing changed.
      #      "Started" is spelled out as the three outcomes of a step that RAN (success, failure,
      #        cancelled), so a step that never ran (skipped, or no outcome at all) never records.
      - name: Record the deployed commit
        id: record_commit
        if: >-
          always() &&
          (contains(fromJSON('["success","failure","cancelled"]'), steps.apply_off.outcome) ||
           contains(fromJSON('["success","failure","cancelled"]'), steps.phase_a.outcome))
        run: |
          COMMIT="$(git rev-parse HEAD)"
          aws ssm put-parameter --name "$DEPLOYED_COMMIT_PARAMETER" --value "$COMMIT" --overwrite > /dev/null
          echo "SSM $DEPLOYED_COMMIT_PARAMETER = $COMMIT"

      # CHAPTER 10: report = say what happened (and, after a failure, why).
      # 39. Only when something above FAILED (and compute is on): print the latest ECS service events.
      #     WHY: they say WHY containers do not start or stay healthy ("CannotPullContainerError",
      #     "failed health checks", "circuit breaker triggered", ...), right in this log.
      - name: Print the latest ECS service events
        if: failure() && steps.state.outputs.compute_enabled == 'true'
        working-directory: infra
        run: |
          CLUSTER="$(pulumi stack output clusterName 2>/dev/null || true)"
          if [ -z "$CLUSTER" ] || [ "$CLUSTER" = "null" ]; then echo "No cluster (yet)."; exit 0; fi
          for SERVICE in minitickets-dev-api minitickets-dev-web; do
            echo "--- $SERVICE: newest events first ---"
            aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
              --query 'services[0].events[:8].[createdAt,message]' --output text || true
          done

      # 40. Job summary (the run's page in the Actions tab), ALSO after a failure.
      #     What was deployed, how the migration went, where the app is, and how to roll back.
      - name: Write job summary
        if: always()
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          CURRENT: ${{ steps.state.outputs.current_tag }}
          COMPUTE: ${{ steps.state.outputs.compute_enabled }}
          GUARD: ${{ steps.guard.outcome }}
          APPLY_OFF: ${{ steps.apply_off.outcome }}
          PHASE_A: ${{ steps.phase_a.outcome }}
          MIGRATE: ${{ steps.migrate.outcome }}
          PHASE_B: ${{ steps.phase_b.outcome }}
          WAIT: ${{ steps.wait.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          RECORD: ${{ steps.record_commit.outcome == 'success' && 'recorded this commit' || 'not changed' }}
          APP_URL: ${{ steps.smoke.outputs.app_url }}
          ALB: ${{ steps.smoke.outputs.alb }}
          DNS_TARGET: ${{ steps.smoke.outputs.dns_target }}
        run: |
          {
            echo "## Deploy to dev"
            echo
            echo "Image tag: \`$TAG\` (before this run: \`${CURRENT:-unknown}\`)"
            echo
            if [ "$GUARD" = "failure" ]; then
              echo "**The deploy guard refused this run** (older infrastructure code than the deployed commit, or superseded by a newer commit on main). Nothing in AWS changed. The reason is in the guard step's log."
            elif [ "$COMPUTE" != "true" ]; then
              echo "computeEnabled is **false** in the committed \`infra/Pulumi.dev.yaml\`: ran \`pulumi up\` to match it (**$APPLY_OFF**). No image was deployed; SSM still says \`${CURRENT:-?}\`."
            else
              echo "| Step | Result |"
              echo "|---|---|"
              echo "| Phase A (pulumi up, migration image = new) | $PHASE_A |"
              echo "| Migration | $MIGRATE |"
              echo "| Phase B (SSM + ECR tag + pulumi up) | $PHASE_B |"
              echo "| Services + worker Lambda on the new version | $WAIT |"
              echo "| Smoke test | ${SMOKE:-skipped} |"
              echo
              if [ -n "$APP_URL" ]; then echo "App: $APP_URL"; else echo "App: no public URL (entryEnabled is false)."; fi
              if [ -n "$ALB" ]; then
                echo
                if [ "$DNS_TARGET" = "$ALB" ]; then
                  echo "DNS: the CNAME already points at this ALB."
                else
                  echo "**DNS: update the CNAME at your DNS provider.** \`${APP_URL#https://}\` points at \`${DNS_TARGET:-nothing}\`, the ALB is \`$ALB\` (DNS only, no proxy)."
                fi
              fi
              if [ "$MIGRATE" = "failure" ]; then
                echo
                echo "The migration failed, so phase B never ran: the services still run \`${CURRENT:-?}\`."
              fi
            fi
            echo
            echo "Deployed commit (SSM, for the deploy guard): **$RECORD**"
            echo
            echo "### Roll back"
            echo "Actions -> CD -> **Run workflow** (branch main) -> image_tag = an older tag (e.g. \`${CURRENT:-<sha>}\`)."
            echo "It skips the build, runs that image's migrations (already applied = nothing to do) and rolls the services back."
            echo "It keeps main's newest infrastructure code, so the deploy guard lets it through. Older infrastructure"
            echo "code is refused unless you tick **allow_older_infra** (a deliberate infra rollback: it deletes newer resources)."
            echo
            echo "A rollback runs OLD code against the database the NEW code migrated. It is only safe because migrations"
            echo "are **backward compatible** (expand/contract): first ADD (new column, nullable or with a default) and"
            echo "deploy code that works with both shapes; only in a LATER deploy, remove what the old code still needed."
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
