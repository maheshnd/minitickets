# ElasticMQ settings (the local stand-in for Amazon SQS). Mounted by docker-compose.yml.
# A running container reads this file only at startup: after a change, `docker compose restart queue`
# (messages waiting in the queue are lost then: ElasticMQ keeps them in memory).

include classpath("application.conf")

# 1. The address that goes INTO queue URLs. Our api and worker run on the laptop, so they
#    reach the queue at localhost:9324 (the port published in docker-compose.yml).
node-address {
  protocol = http
  host = localhost
  port = 9324
  context-path = ""
}

# 2. The queues created at startup. The name is part of the queue URL:
#    http://localhost:9324/000000000000/minitickets-jobs
queues {
  minitickets-jobs {
    # 2a. VISIBILITY TIMEOUT: how long a received message stays hidden from other consumers while
    #     the worker handles it. If the worker does not delete it in this time (it failed or
    #     crashed), it becomes visible again and is delivered again. That is "at-least-once" delivery.
    #     It must be LONGER than the handler's maximum run time. If it were shorter, a slow but
    #     healthy handler would still be busy when the message reappears, a second worker would
    #     take it, and the email would go out twice. (On AWS, with Lambda reading the queue, AWS
    #     recommends at least 6 x the function's timeout.) After a FAILURE the worker overrides
    #     this per message with a growing wait (backoff, apps/worker/src/backoff.ts).
    defaultVisibilityTimeout = 30 seconds

    # 2b. DEAD-LETTER QUEUE (the "redrive policy"). Every delivery adds 1 to a message's receive
    #     count. Once a message has been received maxReceiveCount times without being deleted,
    #     the queue stops offering it to the worker and moves it to the dead-letter queue (DLQ)
    #     instead. So a POISON message (one that can never succeed, e.g. a schema version the
    #     worker does not know) gets 3 tries, then is parked where a person can look at it
    #     (`pnpm jobs:dlq`), instead of coming back forever.
    #     How the two settings relate: the time a message spends here before the DLQ is roughly
    #     the sum of its waits between tries (with our backoff: 10 s + 40 s + 120 s).
    deadLettersQueue {
      name = "minitickets-jobs-dlq"
      maxReceiveCount = 3
    }
  }

  # 3. The dead-letter queue itself: an ordinary queue. Nothing reads it automatically; a person
  #    lists it (`pnpm jobs:dlq`) and, after fixing the cause, moves the messages back (`pnpm jobs:redrive`).
  minitickets-jobs-dlq {
    defaultVisibilityTimeout = 30 seconds
  }
}
